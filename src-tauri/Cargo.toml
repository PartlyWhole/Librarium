[package]
name = "librarium-app"
description = "Librarium: the composition root. The only crate that names adapters and features."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "librarium-app"

[lib]
name = "librarium_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
librarium-contracts.workspace = true
librarium-kernel.workspace = true
librarium-api.workspace = true
librarium-system = { path = "../crates/adapters/system" }
librarium-worker-process = { path = "../crates/adapters/worker-process" }
librarium-transport-tauri = { path = "../crates/adapters/transport-tauri" }
librarium-fs-macos = { path = "../crates/adapters/fs-macos" }
librarium-changes-fsevents = { path = "../crates/adapters/changes-fsevents" }
librarium-index-sqlite = { path = "../crates/adapters/index-sqlite" }
librarium-versions-none = { path = "../crates/adapters/versions-none" }
librarium-feature-notes = { path = "../crates/features/notes" }
librarium-feature-daily = { path = "../crates/features/daily" }
librarium-feature-captures = { path = "../crates/features/captures" }
librarium-feature-library = { path = "../crates/features/library" }
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
log = "0.4"

[dev-dependencies]
librarium-testkit.workspace = true
cargo_metadata = "0.23"
syn = { version = "2", features = ["full", "visit", "parsing"] }
proc-macro2 = "1"
uuid.workspace = true

[lints]
workspace = true
