[package]
name = "librarium-worker"
description = "The worker binary: parsers of untrusted or heavy input run here, never in the app. Speaks JSON-RPC over stdin/stdout."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
imagesize = "0.14"
libc = "0.2"
librarium-contracts.workspace = true
lopdf = "0.38"
pdf-extract = "0.12"
roxmltree = "0.21"
serde.workspace = true
serde_json.workspace = true
zip = { version = "8", default-features = false, features = ["deflate"] }

objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSURL", "NSDictionary", "NSError", "NSData"] }
objc2-vision = { version = "0.3", features = ["VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes", "objc2-core-foundation", "objc2-core-graphics", "objc2-image-io"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes", "CFURL", "CFString"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGPDFDocument", "CGPDFPage", "CGContext", "CGBitmapContext", "CGColorSpace", "CGDataProvider"] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = ["std", "PDFDocument", "PDFPage"] }

[lints]
workspace = true
