[workspace]
resolver = "2"
members = [
  "crates/contracts",
  "crates/kernel",
  "crates/api",
  "crates/testkit",
  "crates/adapters/*",
  "crates/features/*",
  "crates/worker",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
# ours
librarium-contracts = { path = "crates/contracts" }
librarium-kernel = { path = "crates/kernel" }
librarium-api = { path = "crates/api" }
librarium-testkit = { path = "crates/testkit" }
# borrowed, pinned to a minor
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
ts-rs = { version = "12", features = ["serde-json-impl", "uuid-impl", "no-serde-warnings"] }
tauri = { version = "2" }
tauri-build = { version = "2" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev.package."*"]
opt-level = 1
