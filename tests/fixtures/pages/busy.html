<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>A busy page</title>
<style>.tick { color: #333; } .tock { color: #334; } .ad { display: inline-block; width: 4px; height: 4px; }</style></head>
<body>
<article>
  <h1>A busy page</h1>
  <p>Technique integrates everything. It avoids shock and sensational events.</p>
  <div id="ads"></div>
</article>
<script>
  // Like ad-heavy sites: hundreds of elements change all the time, without timers (which hidden
  // windows slow down).
  const ads = document.getElementById("ads");
  for (let i = 0; i < 600; i++) { const s = document.createElement("span"); s.className = "ad tick"; ads.appendChild(s); }
  const c = new MessageChannel();
  let n = 0;
  c.port1.onmessage = () => {
    n++;
    for (const s of ads.children) s.className = n % 2 ? "ad tick" : "ad tock";
    if (n % 50 === 0) { const s = document.createElement("span"); s.className = "ad tick"; ads.appendChild(s); ads.firstChild.remove(); }
    setTimeout(() => c.port2.postMessage(0), 0);
  };
  c.port2.postMessage(0);
</script>
</body>
</html>
